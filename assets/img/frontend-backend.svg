<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #191c22; }
  .muted { fill: #5d6470; font-size: 12px; }
  .label { font-size: 10.5px; fill: #5d6470; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .box { fill: #ffffff; stroke: #d5d9e2; stroke-width: 1.5; }
  .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  .arrow { fill: #6b7280; }
  .accent { fill: #0f766e; }
  .accent-stroke { stroke: #0f766e; stroke-width: 2.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e2e6ee; }
    .muted { fill: #939cab; }
    .label { fill: #939cab; }
    .box { fill: #13171e; stroke: #2e3540; }
    .edge { stroke: #8b95a5; }
    .arrow { fill: #8b95a5; }
    .accent { fill: #5eead4; }
    .accent-stroke { stroke: #5eead4; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="arrow"/></marker></defs>
<rect class="box" x="20" y="58" width="190" height="102" rx="4"/>
<text x="115" y="88" text-anchor="middle" font-size="14" font-weight="600">Frontend</text>
<text x="115" y="109" text-anchor="middle" class="muted">runs in the browser</text>
<text x="115" y="128" text-anchor="middle" class="muted">what people see</text>

<rect class="box" x="265" y="58" width="190" height="102" rx="4"/>
<text x="360" y="88" text-anchor="middle" font-size="14" font-weight="600">Backend</text>
<text x="360" y="109" text-anchor="middle" class="muted">runs on a server</text>
<text x="360" y="128" text-anchor="middle" class="muted">rules, secrets, data</text>

<rect class="box" x="510" y="58" width="190" height="102" rx="4"/>
<text x="605" y="88" text-anchor="middle" font-size="14" font-weight="600">Database</text>
<text x="605" y="109" text-anchor="middle" class="muted">stores users, posts,</text>
<text x="605" y="128" text-anchor="middle" class="muted">orders, scores</text>

<line class="edge" x1="212" y1="100" x2="257" y2="100" marker-end="url(#a)"/>
<text x="235" y="90" text-anchor="middle" class="label">API</text>

<line class="edge" x1="457" y1="100" x2="502" y2="100" marker-end="url(#a)"/>
<text x="480" y="90" text-anchor="middle" class="label">SQL</text>

<text x="360" y="200" text-anchor="middle" class="muted">Anything in the frontend is visible to the user, so keys and rules live in the backend.</text>

</svg>
