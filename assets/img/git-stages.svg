<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #191c22; }
  .muted { fill: #5d6470; font-size: 12px; }
  .label { font-size: 10.5px; fill: #5d6470; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .box { fill: #ffffff; stroke: #d5d9e2; stroke-width: 1.5; }
  .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  .arrow { fill: #6b7280; }
  .accent { fill: #c2410c; }
  .accent-stroke { stroke: #c2410c; stroke-width: 2.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e2e6ee; }
    .muted { fill: #939cab; }
    .label { fill: #939cab; }
    .box { fill: #13171e; stroke: #2e3540; }
    .edge { stroke: #8b95a5; }
    .arrow { fill: #8b95a5; }
    .accent { fill: #fdba74; }
    .accent-stroke { stroke: #fdba74; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="arrow"/></marker></defs>
<rect class="box" x="20" y="52" width="190" height="96" rx="4"/>
<text x="115" y="84" text-anchor="middle" font-size="14" font-weight="600">Working folder</text>
<text x="115" y="106" text-anchor="middle" class="muted">the files you edit</text>

<rect class="box" x="265" y="52" width="190" height="96" rx="4"/>
<text x="360" y="84" text-anchor="middle" font-size="14" font-weight="600">Staging area</text>
<text x="360" y="106" text-anchor="middle" class="muted">what goes in the next commit</text>

<rect class="box" x="510" y="52" width="190" height="96" rx="4"/>
<text x="605" y="84" text-anchor="middle" font-size="14" font-weight="600">History</text>
<text x="605" y="106" text-anchor="middle" class="muted">the commits you made</text>

<line class="edge" x1="212" y1="96" x2="257" y2="96" marker-end="url(#a)"/>
<text x="235" y="116" text-anchor="middle" class="mono label">git add</text>

<line class="edge" x1="457" y1="96" x2="502" y2="96" marker-end="url(#a)"/>
<text x="480" y="116" text-anchor="middle" class="mono label">git commit</text>

<text x="360" y="190" text-anchor="middle" class="muted">git status tells you which stage each file is in.</text>

</svg>
