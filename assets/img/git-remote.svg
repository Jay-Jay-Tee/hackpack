<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #191c22; }
  .muted { fill: #5d6470; font-size: 12px; }
  .label { font-size: 10.5px; fill: #5d6470; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .box { fill: #ffffff; stroke: #d5d9e2; stroke-width: 1.5; }
  .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  .arrow { fill: #6b7280; }
  .accent { fill: #c2410c; }
  .accent-stroke { stroke: #c2410c; stroke-width: 2.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e2e6ee; }
    .muted { fill: #939cab; }
    .label { fill: #939cab; }
    .box { fill: #13171e; stroke: #2e3540; }
    .edge { stroke: #8b95a5; }
    .arrow { fill: #8b95a5; }
    .accent { fill: #fdba74; }
    .accent-stroke { stroke: #fdba74; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="arrow"/></marker></defs>
<rect class="box" x="30" y="52" width="250" height="100" rx="4"/>
<text x="155" y="88" text-anchor="middle" font-size="14" font-weight="600">Your laptop</text>
<text x="155" y="110" text-anchor="middle" class="muted">the local repo, where you commit</text>

<rect class="box" x="440" y="52" width="250" height="100" rx="4"/>
<text x="565" y="88" text-anchor="middle" font-size="14" font-weight="600">GitHub</text>
<text x="565" y="110" text-anchor="middle" class="muted">the remote copy, where you back up</text>

<line class="edge" x1="282" y1="86" x2="432" y2="86" marker-end="url(#a)"/>
<text x="357" y="76" text-anchor="middle" class="mono label">git push</text>

<line class="edge" x1="438" y1="124" x2="288" y2="124" marker-end="url(#a)"/>
<text x="357" y="144" text-anchor="middle" class="mono label">git pull</text>

<text x="360" y="190" text-anchor="middle" class="muted">A commit stays on your laptop until you push it. Cloning copies the whole history down.</text>

</svg>
