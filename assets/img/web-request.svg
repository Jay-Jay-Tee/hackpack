<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #191c22; }
  .muted { fill: #5d6470; font-size: 12px; }
  .label { font-size: 10.5px; fill: #5d6470; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .box { fill: #ffffff; stroke: #d5d9e2; stroke-width: 1.5; }
  .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  .arrow { fill: #6b7280; }
  .accent { fill: #1d4ed8; }
  .accent-stroke { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e2e6ee; }
    .muted { fill: #939cab; }
    .label { fill: #939cab; }
    .box { fill: #13171e; stroke: #2e3540; }
    .edge { stroke: #8b95a5; }
    .arrow { fill: #8b95a5; }
    .accent { fill: #93b4ff; }
    .accent-stroke { stroke: #93b4ff; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="arrow"/></marker></defs>
<rect class="box" x="24" y="58" width="170" height="92" rx="4"/>
<text x="109" y="94" text-anchor="middle" font-size="14" font-weight="600">Your browser</text>
<text x="109" y="115" text-anchor="middle" class="muted">the client</text>

<rect class="box" x="526" y="58" width="170" height="92" rx="4"/>
<text x="611" y="94" text-anchor="middle" font-size="14" font-weight="600">The server</text>
<text x="611" y="115" text-anchor="middle" class="muted">a computer online</text>

<line class="edge" x1="196" y1="88" x2="518" y2="88" marker-end="url(#a)"/>
<text x="357" y="78" text-anchor="middle" class="mono label">GET /rain-check/</text>

<line class="edge" x1="524" y1="122" x2="202" y2="122" marker-end="url(#a)"/>
<text x="357" y="142" text-anchor="middle" class="mono label">200 OK + the page</text>

<text x="360" y="192" text-anchor="middle" class="muted">One page load is many of these: the HTML first, then CSS, JS and images.</text>

</svg>
