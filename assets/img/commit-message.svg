<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #191c22; }
  .muted { fill: #5d6470; font-size: 12px; }
  .label { font-size: 10.5px; fill: #5d6470; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .box { fill: #ffffff; stroke: #d5d9e2; stroke-width: 1.5; }
  .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  .arrow { fill: #6b7280; }
  .accent { fill: #c2410c; }
  .accent-stroke { stroke: #c2410c; stroke-width: 2.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e2e6ee; }
    .muted { fill: #939cab; }
    .label { fill: #939cab; }
    .box { fill: #13171e; stroke: #2e3540; }
    .edge { stroke: #8b95a5; }
    .arrow { fill: #8b95a5; }
    .accent { fill: #fdba74; }
    .accent-stroke { stroke: #fdba74; }
  }
</style>

<text x="64" y="86" class="mono" font-size="19">feat(upload): accept HEIC photos</text>

<line class="accent-stroke" x1="64" y1="100" x2="107" y2="100"/>
<line class="accent-stroke" x1="107" y1="100" x2="193" y2="100"/>
<line class="accent-stroke" x1="215" y1="100" x2="409" y2="100"/>

<line class="edge" x1="85" y1="100" x2="85" y2="110"/>
<line class="edge" x1="150" y1="100" x2="150" y2="110"/>
<line class="edge" x1="312" y1="100" x2="312" y2="110"/>

<text x="85" y="126" text-anchor="middle" class="label">type</text>
<text x="150" y="126" text-anchor="middle" class="label">scope</text>
<text x="312" y="126" text-anchor="middle" class="label">summary</text>

<text x="64" y="166" class="muted">feat, fix, docs, chore: the type says what kind of change it is.</text>
<text x="64" y="186" class="muted">The summary is imperative and lowercase: add, fix, remove.</text>

</svg>
