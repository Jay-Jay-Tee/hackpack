<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #191c22; }
  .muted { fill: #5d6470; font-size: 12px; }
  .label { font-size: 10.5px; fill: #5d6470; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .box { fill: #ffffff; stroke: #d5d9e2; stroke-width: 1.5; }
  .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  .arrow { fill: #6b7280; }
  .accent { fill: #0369a1; }
  .accent-stroke { stroke: #0369a1; stroke-width: 2.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e2e6ee; }
    .muted { fill: #939cab; }
    .label { fill: #939cab; }
    .box { fill: #13171e; stroke: #2e3540; }
    .edge { stroke: #8b95a5; }
    .arrow { fill: #8b95a5; }
    .accent { fill: #7dd3fc; }
    .accent-stroke { stroke: #7dd3fc; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="arrow"/></marker></defs>
<rect class="box" x="20" y="58" width="145" height="88" rx="4"/>
<text x="92" y="90" text-anchor="middle" font-size="14" font-weight="600">git push</text>
<text x="92" y="112" text-anchor="middle" class="muted">your code</text>

<rect class="box" x="205" y="58" width="145" height="88" rx="4"/>
<text x="277" y="90" text-anchor="middle" font-size="14" font-weight="600">GitHub</text>
<text x="277" y="112" text-anchor="middle" class="muted">the repo</text>

<rect class="box" x="390" y="58" width="145" height="88" rx="4"/>
<text x="462" y="90" text-anchor="middle" font-size="14" font-weight="600">The host</text>
<text x="462" y="112" text-anchor="middle" class="muted">installs and builds</text>

<rect class="box" x="575" y="58" width="125" height="88" rx="4"/>
<text x="637" y="90" text-anchor="middle" font-size="14" font-weight="600">Live URL</text>
<text x="637" y="112" text-anchor="middle" class="muted">anyone can open</text>

<line class="edge" x1="167" y1="102" x2="197" y2="102" marker-end="url(#a)"/>
<line class="edge" x1="352" y1="102" x2="382" y2="102" marker-end="url(#a)"/>
<line class="edge" x1="537" y1="102" x2="567" y2="102" marker-end="url(#a)"/>

<text x="360" y="182" text-anchor="middle" class="muted">Every push to main repeats the last two steps, so the live site can never drift from the code.</text>

</svg>
