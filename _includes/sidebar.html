<ul class="nav-list">
{%- for s in site.data.nav %}
  <li{% if s.key == section_key %} class="active"{% endif %}>
    <a href="{{ s.url | relative_url }}" class="section{% if page.url == s.url %} current{% endif %}"{% if page.url == s.url %} aria-current="page"{% endif %}><span class="dot dot-{{ s.key }}" aria-hidden="true"></span>{{ s.title }}</a>
    {%- if s.pages %}
    <ul>
      {%- for p in s.pages %}
      <li><a href="{{ p.url | relative_url }}"{% if page.url == p.url %} class="current" aria-current="page"{% endif %}>{{ p.title }}</a></li>
      {%- endfor %}
    </ul>
    {%- endif %}
  </li>
{%- endfor %}
</ul>
